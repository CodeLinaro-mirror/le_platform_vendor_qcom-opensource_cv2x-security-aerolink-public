httpAuth               none # none, oAuth2.0
errorCodeHttpAttribute "Ieee-1609.2.1-Error"
serviceable_CtlSeriesIds = [
    0x11223344556677
]
initialEc = {
    identification canonical-id # none, canonical-id
    encrypt        false # true, false
}
pki_services = [
    {
        name requestEC
        url  "https://server:443/v3/enrollment-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name renewEC
        url "https://server:443/v3/successor-enrollment-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name downloadEC
        url "https://server:443/v3/successor-enrollment-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name requestPC
        url  "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name downloadPC
        url "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name requestAC
        url  "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name downloadAC
        url "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name requestIC
        url  "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name downloadIC
        url "https://server:443/v3/authorization-certificate"
        retryInterval 600s
        maxRetryCount 5
    },
    {
        name downloadCTL
        url  "https://server:443/v3/ctl"
        retryInterval 600s
        maxRetryCount 5
        updateFrequency 24h
    },
    {
        name downloadCRLCTL
        url  "https://server:443/v3/composite-crl-ctl"
        retryInterval 600s
        maxRetryCount 5
        updateFrequency 24h
    },
    {
        name downloadCCF
        url  "https://server:443/v3/ccf-ctl"
        retryInterval 600s
        maxRetryCount 5
        updateFrequency 24h
    },
    {
        name downloadRA
        url  "https://server:443/v3/ra-certificate"
        retryInterval 600s
        maxRetryCount 5
        updateFrequency 24h
    }
]
