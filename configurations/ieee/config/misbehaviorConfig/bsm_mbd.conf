### Configuration file for BSM Misbehavior Report

# Storage size on file system
MaxStorageSize                                   10 # units: MB

MaxRemoteVehicles                               100 # max no. vehicles processed

#################################################################################
# Report Type: One end entity inconsistent BSMs
# Constant Position Detector
ConstantPositionDetectorEnabled                true # true or false

# Random Position Detector
RandomPositionDetectorEnabled                  true # true or false
RandomPositionDetectorGpsDriftThreshold           1 # units: meters

#################################################################################
# Report Type: Suspicious BSM
# High Speed Detector
HighSpeedDetectorEnabled                       true # true or false
HighSpeedDetectorThreshold                     4500 # units: 0.02 meters/second

# High Longitudinal Acceleration Detector
HighLongAccelerationDetectorEnabled            true # true or false
HighLongAccelerationDetectorThreshold          1000 # units: 0.01 meters/second^2

# Brake And Acceleration Detector
BrakeAndAccelerationDetectorEnabled            true # true or false

# High Longitudinal Deceleration Detector
HighLongDecelerationDetectorEnabled            true # true or false
HighLongDecelerationDetectorThreshold          1000 # units: 0.01 meters/second^2

# High Lateral Acceleration Detector
HighLatAccelerationDetectorEnabled             true # true or false
HighLatAccelerationDetectorThreshold           1000 # units: 0.01 meters/second^2

# High YawRate Detector
HighYawRateDetectorEnabled                     true # true or false
HighYawRateDetectorThreshold                   8600 # units: 0.01 degrees/second

#################################################################################
#Report Type: Suspicious BSM Plus
# High Distance / GPS Drift Detector
HighDistanceGpsDriftDetectorEnabled            false # true or false
HighDistanceGpsDriftDetectorDistanceThreshold  3000 # units: meters
HighDistanceGpsDriftDetectorGpsDriftThreshold    10 # units: meters
